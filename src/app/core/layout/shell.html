<div class="shell">
  <!-- Sidebar: só aparece a partir de 768px -->
  <aside class="shell-side">
    <span class="shell-brand">rachaae</span>
    <nav class="side-nav" aria-label="Navegação principal">
      <a
        routerLink="/grupos"
        routerLinkActive="is-active"
        #sideGruposLink="routerLinkActive"
        [attr.aria-current]="sideGruposLink.isActive ? 'page' : null"
      >
        <span class="material-symbols-outlined">groups</span>
        Grupos
      </a>
      <a
        routerLink="/ajustes"
        routerLinkActive="is-active"
        #sideAjustesLink="routerLinkActive"
        [attr.aria-current]="sideAjustesLink.isActive ? 'page' : null"
      >
        <span class="material-symbols-outlined">settings</span>
        Ajustes
      </a>
    </nav>
  </aside>

  <header class="shell-header">
    <span class="shell-brand">rachaae</span>
  </header>

  <main class="shell-main">
    <router-outlet />
  </main>

  <nav class="shell-nav" aria-label="Navegação principal">
    <a
      routerLink="/grupos"
      routerLinkActive="is-active"
      #gruposLink="routerLinkActive"
      [attr.aria-current]="gruposLink.isActive ? 'page' : null"
    >
      <span class="material-symbols-outlined">groups</span>
      <span class="shell-nav-label label-caps">Grupos</span>
    </a>
    <a
      routerLink="/ajustes"
      routerLinkActive="is-active"
      #ajustesLink="routerLinkActive"
      [attr.aria-current]="ajustesLink.isActive ? 'page' : null"
    >
      <span class="material-symbols-outlined">settings</span>
      <span class="shell-nav-label label-caps">Ajustes</span>
    </a>
  </nav>
</div>
