<main class="page">
  <header class="page-header">
    <h1 class="display-hero">Ajustes</h1>
  </header>

  <section class="settings-section">
    <div class="card card--setting">
      <div class="setting-row">
        <div class="setting-label">
          <span class="label-caps">Nome</span>
          <p class="setting-value">{{ user()?.name || '—' }}</p>
        </div>
        <div class="setting-input">
          <input type="text" placeholder="Como você quer aparecer nos grupos…" [formControl]="displayName" maxlength="60" (keyup.enter)="saveName()" />
          <button class="btn-secondary btn-secondary--sm" type="button" [disabled]="savingName() || displayName.invalid" (click)="saveName()">Salvar</button>
        </div>
      </div>
      @if (displayName.touched && displayName.invalid) { <span class="field-error">Máximo de 60 caracteres.</span> }
      @if (nameError()) { <p class="page-error" role="alert">{{ nameError() }}</p> }
    </div>

    <div class="card card--setting">
      <div class="setting-row">
        <div class="setting-label">
          <span class="label-caps">Tema</span>
          <p class="setting-hint">O tema salvo continua valendo depois de fechar o app.</p>
        </div>
        <div class="setting-input">
          <div class="theme-switch" role="group" aria-label="Escolher tema">
            <button type="button" class="theme-option" [class.is-selected]="theme.preference() === 'light'" (click)="theme.preference.set('light')">Claro</button>
            <button type="button" class="theme-option" [class.is-selected]="theme.preference() === 'dark'" (click)="theme.preference.set('dark')">Escuro</button>
          </div>
        </div>
      </div>
    </div>
  </section>

  @if (errorMessage()) { <p class="page-error" role="alert">{{ errorMessage() }}</p> }

  <button class="btn-secondary btn-secondary--full btn-danger-text" type="button" [disabled]="loggingOut()" (click)="logout()">
    {{ loggingOut() ? 'Saindo…' : 'Sair' }}
  </button>
</main>
