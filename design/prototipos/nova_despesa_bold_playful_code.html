<script>
  (function() {
    const amountInput = document.getElementById('expense-amount');
    const checkboxes = Array.from(document.querySelectorAll('.member-checkbox'));
    const shareLabels = Array.from(document.querySelectorAll('.per-share'));
    const quotaLabel = document.getElementById('quota-label');
    const selectedCount = document.getElementById('selected-count');
    const payerButtons = Array.from(document.querySelectorAll('.payer-btn'));
    const toggleAllBtn = document.getElementById('toggle-all');
    const btnSave = document.getElementById('btn-save');

    function parseAmount(val) {
      const clean = val.replace(/[^\d,\.]/g, '').replace(',', '.');
      const num = parseFloat(clean);
      return isNaN(num) ? 0 : num;
    }

    function formatBRL(num) {
      return num.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function recalculateShares() {
      const total = parseAmount(amountInput.value);
      const activeCount = checkboxes.filter(cb => cb.checked).length;
      selectedCount.textContent = activeCount;

      if (activeCount === 0) {
        shareLabels.forEach(label => label.textContent = 'R$ 0,00');
        quotaLabel.textContent = '0 cotas';
        return;
      }

      const share = total / activeCount;
      const formatted = 'R$ ' + formatBRL(share);

      checkboxes.forEach((cb, idx) => {
        if (cb.checked) {
          shareLabels[idx].textContent = formatted;
          shareLabels[idx].classList.remove('opacity-40');
        } else {
          shareLabels[idx].textContent = 'R$ 0,00';
          shareLabels[idx].classList.add('opacity-40');
        }
      });

      quotaLabel.textContent = activeCount + (activeCount === 1 ? ' cota individual' : ' cotas iguais');
    }

    checkboxes.forEach((cb) => {
      cb.addEventListener('change', () => {
        const parent = cb.closest('label');
        const visualBox = parent.querySelector('.chk-box');
        if (cb.checked) {
          visualBox.className = 'chk-box w-6 h-6 rounded-lg bg-tertiary-fixed text-on-tertiary-fixed flex items-center justify-center transition-colors shrink-0';
          visualBox.innerHTML = '<span class="material-symbols-outlined text-[18px] font-bold">check</span>';
        } else {
          visualBox.className = 'chk-box w-6 h-6 rounded-lg bg-surface-container-high text-transparent flex items-center justify-center transition-colors shrink-0';
          visualBox.innerHTML = '';
        }
        recalculateShares();
      });
    });

    amountInput.addEventListener('input', recalculateShares);

    payerButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        payerButtons.forEach(b => {
          b.className = 'payer-btn flex items-center gap-space-sm p-3 rounded-xl bg-surface-container-lowest text-on-surface hover:bg-surface-container-low transition-transform active:scale-95 text-left';
          const badge = b.querySelector('.payer-badge');
          if (badge) badge.classList.add('hidden');
          const sub = b.querySelector('.opacity-90');
          if (sub) {
            sub.className = 'font-body-sm text-body-sm text-on-surface-variant truncate';
            sub.textContent = 'Amigo(a)';
          }
        });

        btn.className = 'payer-btn flex items-center gap-space-sm p-3 rounded-xl bg-primary-container text-on-primary-container shadow-sm transition-transform active:scale-95 text-left';
        const badge = btn.querySelector('.payer-badge');
        if (badge) badge.classList.remove('hidden');
        const sub = btn.querySelector('.text-on-surface-variant');
        if (sub) {
          sub.className = 'font-body-sm text-body-sm opacity-90 truncate';
          sub.textContent = 'Pagador(a)';
        }
      });
    });

    if (toggleAllBtn) {
      toggleAllBtn.addEventListener('click', () => {
        const allChecked = checkboxes.every(cb => cb.checked);
        checkboxes.forEach(cb => {
          cb.checked = !allChecked;
          cb.dispatchEvent(new Event('change'));
        });
      });
    }

    if (btnSave) {
      btnSave.addEventListener('click', () => {
        btnSave.classList.add('scale-95');
        setTimeout(() => {
          btnSave.classList.remove('scale-95');
          btnSave.innerHTML = '<span class="material-symbols-outlined text-[20px]">done_all</span> Salvo com sucesso!';
          btnSave.classList.remove('bg-secondary-container');
          btnSave.classList.add('bg-tertiary-container', 'text-on-tertiary-container');
        }, 150);
      });
    }

    recalculateShares();
  })();
